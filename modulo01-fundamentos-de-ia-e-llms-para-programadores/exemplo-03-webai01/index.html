<button id="generateButton">Gerar resposta</button>
<output id="output"></output>
<!-- https://www.jsdelivr.com/package/npm/markdown -->
<script src="https://cdn.jsdelivr.net/npm/markdown@0.5.0/lib/markdown.min.js"></script>

<script>
    const output = document.getElementById('output');
    const generateButton = document.getElementById('generateButton');

    generateButton.addEventListener('click', async () => {
        const initialPrompts = [
            {
                role: 'system',
                content: `Você é um assistente de IA que responde de forma clara e objetiva.`
            }
        ]

        const question = 'Quem inventou o JavaScript?'
        const availability = await LanguageModel.availability();

        if (availability === 'unavailable') {
            output.textContent = 'O modelo de IA não está disponível neste dispositivo.';
            return;
        }

        generateButton.disabled = true;
        output.textContent = availability === 'available'
            ? 'Gerando resposta...'
            : 'Baixando o modelo de IA...';

        const session = await LanguageModel.create({
            initialPrompts,
            monitor(monitor) {
                monitor.addEventListener('downloadprogress', (event) => {
                    output.textContent = `Baixando o modelo de IA... ${Math.round(event.loaded * 100)}%`;
                });
            },
        })

        const responseStream = await session.promptStreaming([
            {
                role: 'user',
                content: question
            }
        ])
        output.innerHTML = ""
        let fullText = ""
        for await (const token of responseStream) {
            fullText += token;
            output.innerHTML = markdown.toHTML(fullText);

            // console.log(token)
        }
        generateButton.disabled = false;
    });

</script>
